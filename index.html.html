<title>Roma Lanches</title>

<style>
:root {
  /* Layout: faixa amarela com a logo, navegação fixa por categoria, cardápio em lista de duas colunas, pedido numa folha que sobe da base. */
  --amarelo: #F2B90C;
  --amarelo-escuro: #E0A800;
  --vinho: #6E0505;
  --vermelho: #D61A0A;
  --vermelho-vivo: #F21F0A;
  --creme: #FFFBEA;
  --creme-2: #FFF1BF;
  --linha: #E6D18A;
  --suave: #7C3F2E;
  --branco: #FFFFFF;
  --f-display: 'Lilita One', 'Trebuchet MS', 'Arial Rounded MT Bold', sans-serif;
  --f-corpo: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--navh, 68px)); }
body {
  margin: 0;
  background: var(--creme);
  color: var(--vinho);
  font-family: var(--f-corpo);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--amarelo); z-index: 10; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--vinho); outline-offset: 2px; }
.wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Faixa de abertura */
.hero { background: var(--amarelo); }
.hero .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 22px 18px; }
.hero img { width: 150px; height: auto; display: block; }
.hero-txt { flex: 1 1 260px; min-width: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 8vw, 52px); line-height: 1.02; margin: 0 0 8px; text-wrap: balance; text-transform: uppercase; }
.hero p { margin: 0; max-width: 46ch; font-weight: 500; }
.hero .ig { display: inline-block; margin-top: 10px; font-weight: 800; text-decoration: none; border-bottom: 2px solid var(--vinho); }

/* Navegação por categoria */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--amarelo); border-bottom: 3px solid var(--vermelho-vivo); }
.nav ul { list-style: none; margin: 0; padding: 0 0 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.nav ul::-webkit-scrollbar { display: none; }
.nav a { display: block; white-space: nowrap; padding: 8px 15px; border-radius: 999px; background: var(--amarelo-escuro); color: var(--vinho); font-weight: 800; font-size: 14px; text-decoration: none; }
.nav a[aria-current="true"] { background: var(--vinho); color: var(--amarelo); }

/* Cardápio */
main { padding-block: 8px 150px; }
.sec { padding-top: 28px; }
main .sec:last-of-type { min-height: calc(100dvh - var(--navh, 68px) - env(safe-area-inset-top, 0px)); }
.sec h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 7vw, 40px); text-transform: uppercase; letter-spacing: .02em; margin: 0; padding-bottom: 4px; border-bottom: 3px solid var(--vermelho-vivo); text-wrap: balance; }
.sec .nota { margin: 10px 0 0; font-weight: 700; color: var(--suave); }
.fotos { display: flex; justify-content: center; align-items: flex-end; gap: 4px 10px; flex-wrap: wrap; margin: 24px 0 0; }
.fotos img { height: clamp(84px, 24vw, 138px); width: auto; max-width: 100%; display: block; }
.grid { display: grid; grid-template-columns: 1fr; column-gap: 44px; }
@media (min-width: 780px) { .grid { grid-template-columns: 1fr 1fr; } }
.sub { grid-column: 1 / -1; margin: 22px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
.item { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "nome preco" "desc add"; gap: 6px 14px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--linha); }
.item .nome { grid-area: nome; margin: 0; min-width: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.15; letter-spacing: .02em; text-transform: uppercase; }
.price { grid-area: preco; background: var(--amarelo); color: var(--vinho); font-weight: 800; padding: 3px 10px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .desc { grid-area: desc; margin: 0; min-width: 0; color: var(--suave); font-size: 14.5px; line-height: 1.45; }
.item .add { grid-area: add; align-self: end; }
.btn { appearance: none; border: 0; cursor: pointer; background: var(--vermelho); color: var(--branco); font-weight: 800; padding: 9px 16px; border-radius: 999px; min-height: 40px; white-space: nowrap; }
.btn:hover { background: var(--vinho); }
.btn[disabled] { background: #C9B98A; color: #6b5a36; cursor: not-allowed; }
.btn.big { min-height: 50px; padding: 12px 22px; font-size: 17px; border-radius: 14px; }
.btn.ghost { background: transparent; color: var(--vinho); box-shadow: inset 0 0 0 2px var(--vinho); }
.btn.ghost:hover { background: var(--creme-2); }
footer.rodape { background: var(--vinho); color: var(--amarelo); }
footer.rodape .wrap { padding-block: 26px 140px; font-weight: 600; }
footer.rodape a { font-weight: 800; }

/* Barra do pedido e aviso */
.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--creme) 70%, rgba(255,251,234,0)); }
.cartbar button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto; border: 0; cursor: pointer; background: var(--vermelho); color: var(--branco); font-weight: 800; font-size: 17px; padding: 14px 20px; border-radius: 16px; box-shadow: 0 6px 18px rgba(110,5,5,.35); }
.cartbar button:hover { background: var(--vinho); }
.cartbar b { font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--vinho); color: var(--amarelo); font-weight: 800; padding: 10px 18px; border-radius: 999px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

/* Folha do pedido */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(60, 0, 0, .6); }
.panel { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; max-height: calc(100dvh - 20px - env(safe-area-inset-top, 0px)); background: var(--creme); border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); outline: none; }
@media (min-width: 720px) {
  .panel { inset: 0; margin: auto; height: fit-content; width: min(560px, calc(100% - 32px)); max-height: min(90dvh, 780px); border-radius: 22px; }
}
.phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px max(18px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 3px solid var(--vermelho-vivo); }
.phead h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; min-width: 0; }
.phead .tools { display: flex; gap: 8px; flex: none; }
.ibtn { appearance: none; border: 0; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; background: var(--amarelo); color: var(--vinho); font-size: 24px; font-weight: 800; line-height: 1; display: grid; place-items: center; }
.pbody { padding: 14px max(18px, env(safe-area-inset-left, 0px)) 18px; overflow-y: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.pfoot { padding: 12px max(18px, env(safe-area-inset-left, 0px)) 14px; border-top: 1px solid var(--linha); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--creme); border-radius: 0 0 22px 22px; }
.pfoot .btn.big { flex: 1 1 200px; }
.pbody .desc { margin: 0 0 6px; color: var(--suave); font-size: 14.5px; }
.grp { margin-top: 18px; }
.grp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.grp-head h4 { margin: 0; font-size: 16px; font-weight: 800; }
.grp-head span { font-size: 13px; font-weight: 700; color: var(--suave); }
.opt { display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-bottom: 8px; border: 2px solid var(--linha); border-radius: 12px; background: var(--branco); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--vinho); background: var(--creme-2); }
.opt input { width: 20px; height: 20px; accent-color: var(--vinho); flex: none; margin: 0; }
.opt span { flex: 1; min-width: 0; font-weight: 600; }
.opt em { font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt.cnt { cursor: default; }
.stp { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stp button { appearance: none; border: 0; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: var(--amarelo); color: var(--vinho); font-size: 20px; font-weight: 800; line-height: 1; }
.stp button[disabled] { opacity: .4; cursor: not-allowed; }
.stp output { min-width: 26px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.linha-carrinho { padding: 14px 0; border-bottom: 1px solid var(--linha); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.linha-carrinho .t { margin: 0; font-weight: 800; min-width: 0; }
.linha-carrinho .tp { font-weight: 800; font-variant-numeric: tabular-nums; }
.linha-carrinho .det { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: var(--suave); }
.linha-carrinho input.obs { grid-column: 1 / -1; width: 100%; margin-top: 4px; }
.linha-carrinho .acoes { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.linkbtn { appearance: none; background: none; border: 0; cursor: pointer; text-decoration: underline; font-weight: 700; color: var(--suave); padding: 6px 0; }
.vazio { text-align: center; padding: 28px 8px; font-weight: 600; }
.tot { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.tot.f { font-size: 20px; font-weight: 800; border-top: 2px solid var(--vinho); margin-top: 6px; padding-top: 10px; }
.tot small { font-weight: 600; color: var(--suave); }

/* Formulário */
.f-sec { margin-top: 20px; }
.f-sec:first-child { margin-top: 4px; }
.f-sec h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.campo { display: block; margin-bottom: 10px; }
.campo > span { display: block; font-size: 13.5px; font-weight: 800; margin-bottom: 4px; }
input[type="text"], input[type="tel"], input[type="number"], select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 2px solid var(--linha); border-radius: 12px; background: var(--branco); color: var(--vinho); }
input[type="text"]:focus, input[type="tel"]:focus, input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--vinho); outline: none; box-shadow: 0 0 0 3px var(--amarelo); }
input[aria-invalid="true"] { border-color: var(--vermelho); }
textarea { min-height: 120px; font-size: 13.5px; resize: vertical; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; flex: 1 1 120px; }
.pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pill span { display: block; text-align: center; padding: 11px 12px; border: 2px solid var(--linha); border-radius: 12px; background: var(--branco); font-weight: 800; }
.pill input:checked + span { background: var(--vinho); color: var(--amarelo); border-color: var(--vinho); }
.pill input:focus-visible + span { outline: 3px solid var(--vinho); outline-offset: 2px; }
.caixa { background: var(--creme-2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 14.5px; }
.caixa p { margin: 0 0 8px; }
.caixa p:last-child { margin-bottom: 0; }
.cod { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
.cod code { flex: 1; min-width: 0; padding: 9px 10px; background: var(--branco); border: 2px solid var(--linha); border-radius: 10px; font-size: 12.5px; word-break: break-all; user-select: all; }
.cod .btn { min-height: 0; padding: 8px 14px; }
.chk { display: flex; gap: 10px; align-items: center; font-weight: 600; margin-top: 4px; }
.chk input { width: 20px; height: 20px; accent-color: var(--vinho); margin: 0; }
.erro { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: #FFE1DC; color: #8A1005; font-weight: 700; }
.enviado { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--amarelo); }
.enviado p { margin: 0 0 10px; font-weight: 700; }
.enviado .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ajuda { margin: 8px 0 0; font-size: 13px; color: var(--suave); text-align: center; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; }
a.btn:hover { background: var(--vinho); }
a.btn[aria-disabled="true"] { background: #C9B98A; color: #6b5a36; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>

/* ===== PIX (copia e cola) ===== */
function crc16(s) {
  var c = 0xFFFF;
  for (var i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (var j = 0; j < 8; j++) { c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; }
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function tlv(id, v) { return id + String(v.length).padStart(2, '0') + v; }
function ascii(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase(); }
function pixPayload(chave, nome, cidade, cents) {
  var p = tlv('00', '01') + tlv('01', '11') + tlv('26', tlv('00', 'br.gov.bcb.pix') + tlv('01', chave)) + tlv('52', '0000') + tlv('53', '986');
  if (cents > 0) p += tlv('54', (cents / 100).toFixed(2));
  p += tlv('58', 'BR') + tlv('59', ascii(nome).slice(0, 25) || 'LOJA') + tlv('60', ascii(cidade).slice(0, 15) || 'BRASIL') + tlv('62', tlv('05', '***'));
  p += '6304';
  return p + crc16(p);
}
window.__romaPix = { crc16: crc16, pixPayload: pixPayload };

function spy() {
  if (!('IntersectionObserver' in window)) return;
  var chips = $('#chips');
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var id = e.target.id.replace('cat-', '');
      chips.querySelectorAll('a').forEach(function (a) {
        var on = a.dataset.cat === id;
        if (on) { a.setAttribute('aria-current', 'true'); chips.scrollTo({ left: a.offsetLeft - 16, behavior: reduced() ? 'auto' : 'smooth' }); }
        else a.removeAttribute('aria-current');
      });
    });
  }, { rootMargin: '-35% 0px -60% 0px' });
  document.querySelectorAll('.sec').forEach(function (s) { io.observe(s); });
}

    '<div class="f-sec"><h3>Pagamento</h3><div class="pills">' + pill('pag', 'pix', 'Pix', cust.pag) + pill('pag', 'cartao', 'Cartão', cust.pag) + pill('pag', 'dinheiro', 'Dinheiro', cust.pag) + '</div>' +
      '<div id="sec-pix" class="caixa"></div>' +
      '<div id="sec-cartao" class="caixa"><label class="campo" style="margin:0 0 8px"><span>Tipo de cartão</span><select id="f-cartao"><option' + (cust.cartao === 'Crédito' ? ' selected' : '') + '>Crédito</option><option' + (cust.cartao === 'Débito' ? ' selected' : '') + '>Débito</option></select></label><p>Você paga na maquininha, na entrega ou na retirada.</p></div>' +
      '<div id="sec-dinheiro" class="caixa"><label class="campo" style="margin:0 0 8px"><span>Troco para quanto? (R$)</span><input type="number" id="f-troco" inputmode="decimal" min="0" step="0.01" value="' + esc(cust.troco) + '"></label><label class="chk"><input type="checkbox" id="f-semtroco"' + (cust.semTroco ? ' checked' : '') + '>Não preciso de troco</label></div></div>' +
    '<div class="f-sec"><h3>Resumo</h3><div id="resumo"></div></div>' +
    '<div id="erro" class="erro" role="alert" hidden></div>' +
    '<div id="enviado" class="enviado" hidden></div>' +
  '</div>' +
  '<div class="pfoot"><a class="btn big" id="wa" href="#" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a><p class="ajuda" style="flex-basis:100%;margin:0">O WhatsApp abre com o pedido pronto. Falta só tocar em enviar.</p></div>';
}

function sentHTML() {
  var n = (CONFIG.whatsapp || '').replace(/\D/g, '');
  var fone = n.length === 13 ? '(' + n.slice(2, 4) + ') ' + n.slice(4, 5) + ' ' + n.slice(5, 9) + '-' + n.slice(9) : 'da lanchonete';
  return '<div class="phead"><h2>Pedido aberto no WhatsApp</h2><button type="button" class="ibtn" data-act="close" aria-label="Fechar">×</button></div>' +
    '<div class="pbody"><p class="desc" style="font-weight:700;font-size:16px">Falta só um passo: toque em enviar no WhatsApp para o pedido chegar na lanchonete.</p>' +
    '<p class="desc">Seu carrinho foi limpo. Se o WhatsApp não abriu ou você não chegou a enviar, copie o texto abaixo e mande para ' + esc(fone) + '.</p>' +
    '<textarea id="msgbox" readonly aria-label="Texto do pedido">' + esc(M.msg) + '</textarea></div>' +
    '<div class="pfoot"><button type="button" class="btn big" data-act="copy" data-what="msgbox">Copiar texto do pedido</button><button type="button" class="btn ghost big" data-act="close">Voltar ao cardápio</button></div>';
}

function missing() {
  var m = [];
  if (!cust.nome.trim()) m.push({ id: 'f-nome', l: 'nome' });
  if (cust.tel.replace(/\D/g, '').length < 10) m.push({ id: 'f-tel', l: 'telefone com DDD' });
  if (cust.tipo === 'entrega') {
    if (!cust.rua.trim()) m.push({ id: 'f-rua', l: 'rua e número' });
    if (!cust.bairro.trim()) m.push({ id: 'f-bairro', l: 'bairro' });
  }
  if (cust.pag === 'dinheiro' && !cust.semTroco && !(parseFloat(cust.troco) > 0)) m.push({ id: 'f-troco', l: 'troco (ou marque que não precisa)' });
  return m;
}
function pagamentoTexto() {
  if (cust.pag === 'pix') return 'Pix (pago ao finalizar a ' + (cust.tipo === 'entrega' ? 'entrega' : 'retirada') + ', peço a chave na hora)';
  if (cust.pag === 'cartao') return 'Cartão de ' + cust.cartao.toLowerCase() + ' na ' + (cust.tipo === 'entrega' ? 'entrega' : 'retirada');
  return 'Dinheiro' + (cust.semTroco ? ' (sem troco)' : ' (troco para ' + plain(brl(Math.round(parseFloat(cust.troco || 0) * 100))) + ')');
}
function mensagem() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
  var cod = p(d.getDate()) + p(d.getMonth() + 1) + '-' + p(d.getHours()) + p(d.getMinutes());
  var t = taxa(); var L = [];
  L.push('*NOVO PEDIDO · Roma Lanches*', 'Pedido ' + cod, '');
  L.push('*Cliente:* ' + cust.nome.trim(), '*Telefone:* ' + cust.tel.trim(), '');
  L.push('*Itens:*');
  cart.forEach(function (l) {
    L.push(l.q + 'x ' + l.n + ' — ' + plain(brl(l.u * l.q)));
    l.d.forEach(function (x) { L.push('   • ' + x); });
    if (l.o.trim()) L.push('   • Obs.: ' + l.o.trim());
  });
  L.push('', '*Subtotal:* ' + plain(brl(subtotal())));
  if (cust.tipo === 'entrega') L.push('*Taxa de entrega:* ' + (t == null ? 'a confirmar' : plain(brl(t))));
  L.push('*Total:* ' + plain(brl(total())) + (cust.tipo === 'entrega' && t == null ? ' (+ taxa de entrega)' : ''), '');
  if (cust.tipo === 'entrega') {
    L.push('*Entrega em:* ' + cust.rua.trim() + ', ' + cust.bairro.trim() + (cust.compl.trim() ? ' (' + cust.compl.trim() + ')' : ''));
  } else L.push('*Retirada no local*');
  L.push('*Pagamento:* ' + pagamentoTexto());
  return L.join('\n');
}
function waHref() {
  var n = (CONFIG.whatsapp || '').replace(/\D/g, '');
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(mensagem());
}

function syncCheckout() {
  $('#sec-end').hidden = cust.tipo !== 'entrega';
  $('#sec-pix').hidden = cust.pag !== 'pix';
  $('#sec-cartao').hidden = cust.pag !== 'cartao';
  $('#sec-dinheiro').hidden = cust.pag !== 'dinheiro';
  var t = taxa(), tot = total(), final = cust.tipo !== 'entrega' || t != null;
  var r = '<div class="tot"><span>Subtotal</span><span>' + brl(subtotal()) + '</span></div>';
  if (cust.tipo === 'entrega') r += '<div class="tot"><span>Taxa de entrega</span><span>' + (t == null ? 'a confirmar' : brl(t)) + '</span></div>';
  r += '<div class="tot f"><span>Total' + (final ? '' : ' <small>(sem a taxa)</small>') + '</span><span>' + brl(tot) + '</span></div>';
  $('#resumo').innerHTML = r;
  if (cust.pag === 'pix') {
    var h = '';
    if (CONFIG.pixChave) {
      h += '<p><b>Chave Pix' + (CONFIG.pixTipo ? ' (' + esc(CONFIG.pixTipo) + ')' : '') + '</b></p><div class="cod"><code>' + esc(CONFIG.pixChave) + '</code><button type="button" class="btn" data-act="copy" data-what="chave">Copiar</button></div>';
      if (final) h += '<p><b>Pix copia e cola, no valor de ' + brl(tot) + '</b></p><div class="cod"><code id="pixcode">' + esc(pixPayload(CONFIG.pixChave, CONFIG.pixNome, CONFIG.pixCidade, tot)) + '</code><button type="button" class="btn" data-act="copy" data-what="pixcode">Copiar</button></div>';
      else h += '<p>O valor final depende da taxa de entrega, que o atendente confirma no WhatsApp.</p>';
      h += '<p>Pague e mande o comprovante na conversa do WhatsApp, junto com o pedido.</p>';
    } else {
      h += '<p>Você paga no Pix ao finalizar ' + (cust.tipo === 'entrega' ? 'a entrega' : 'a retirada') + '. É só pedir a chave Pix na hora.</p>';
    }
    $('#sec-pix').innerHTML = h;
  }
  var a = $('#wa');
  a.href = waHref();
  var sent = $('#enviado');
  if (M && M.sent) {
    var num = (CONFIG.whatsapp || '').replace(/\D/g, '');
    sent.hidden = false;
    sent.innerHTML = '<p>O WhatsApp foi aberto com o seu pedido. Para ele chegar na lanchonete, toque em enviar por lá.</p>' +
      (num ? '' : '') +
      '<textarea id="msgbox" readonly aria-label="Texto do pedido">' + esc(mensagem()) + '</textarea>' +
      '<div class="row" style="margin-top:10px"><button type="button" class="btn ghost" data-act="copy" data-what="msgbox">Copiar texto do pedido</button><button type="button" class="btn ghost" data-act="novo">Começar novo pedido</button></div>';
  } else sent.hidden = true;
}

/* ===== PAINEL ===== */
function render(keep) {
  var p = $('#panel');
  var sc = $('.pbody', p); var top = keep && sc ? sc.scrollTop : 0;
  var ae = document.activeElement; var fk = ae && ae.dataset ? ae.dataset.fk : null;
  p.innerHTML = M.mode === 'item' ? itemHTML() : M.mode === 'cart' ? cartHTML() : M.mode === 'sent' ? sentHTML() : checkoutHTML();
  var nb = $('.pbody', p); if (nb) nb.scrollTop = top;
  if (M.mode === 'checkout') syncCheckout();
  if (fk) { var n = p.querySelector('[data-fk="' + fk.replace(/"/g, '') + '"]'); if (n) n.focus({ preventScroll: true }); }
}
function openModal(m) {
  M = m;
  $('#scrim').hidden = false; $('#panel').hidden = false;
  $('#app').inert = true;
  document.documentElement.style.overflow = 'hidden';
  render(false); updateBar();
  $('#panel').focus({ preventScroll: true });
}
function closeModal() {
  M = null;
  $('#scrim').hidden = true; $('#panel').hidden = true; $('#panel').innerHTML = '';
  $('#app').inert = false;
  document.documentElement.style.overflow = '';
  updateBar();
}
function setMode(mode) { M.mode = mode; render(false); $('#panel').focus({ preventScroll: true }); }

function copy(text, ta) {
  function fallback() { if (ta) { ta.focus(); ta.select(); } else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); } }
  try { navigator.clipboard.writeText(text).then(function () { toast('Copiado'); }, function () { fallback(); toast('Selecionado, é só copiar'); }); }
  catch (e) { fallback(); toast('Selecionado, é só copiar'); }
}

/* ===== EVENTOS ===== */
document.addEventListener('click', function (e) {
  var chip = e.target.closest('#chips a');
  if (chip) {
    e.preventDefault();
    var alvo = document.querySelector('#cat-' + chip.dataset.cat + ' h2');
    document.querySelectorAll('#chips a').forEach(function (a) { if (a === chip) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    setNavH();
    if (alvo) alvo.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  if (e.target.closest('#cartbtn')) { openModal({ mode: 'cart' }); return; }
  if (e.target.id === 'scrim') { closeModal(); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, i = +b.dataset.i;
  if (act === 'add') {
    var it = ITENS[b.dataset.id];
    if (!it.o) addLine(it, [], it.p, 1); else openModal({ mode: 'item', item: it, sel: {}, qty: 1 });
  } else if (act === 'close') closeModal();
  else if (act === 'tocart') setMode('cart');
  else if (act === 'tocheckout') setMode('checkout');
  else if (act === 'qdec') { if (M.qty > 1) M.qty--; render(true); }
  else if (act === 'qinc') { if (M.qty < 20) M.qty++; render(true); }
  else if (act === 'ginc' || act === 'gdec') {
    var g = M.item.o.filter(function (x) { return x.id === b.dataset.g; })[0];
    var s2 = M.sel[g.id] = M.sel[g.id] || {};
    if (act === 'ginc' && groupTotal(g) < g.n) s2[i] = (s2[i] || 0) + 1;
    if (act === 'gdec' && s2[i] > 0) s2[i]--;
    render(true);
  } else if (act === 'addsheet') {
    if (!itemValid()) return;
    addLine(M.item, itemDetails(), itemPrice(), M.qty); closeModal();
  } else if (act === 'cinc') { cart[i].q++; saveCart(); render(true); updateBar(); }
  else if (act === 'cdec') { cart[i].q--; if (cart[i].q <= 0) cart.splice(i, 1); saveCart(); render(true); updateBar(); }
  else if (act === 'crem') { cart.splice(i, 1); saveCart(); render(true); updateBar(); }
  else if (act === 'copy') {
    var w = b.dataset.what;
    if (w === 'chave') copy(CONFIG.pixChave);
    else if (w === 'pixcode') copy($('#pixcode').textContent, null);
    else { var ta = $('#msgbox'); copy(ta.value, ta); }
  } else if (act === 'novo') { cart = []; saveCart(); closeModal(); window.scrollTo(0, 0); }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (M && M.mode === 'item' && t.dataset && t.dataset.g) {
    var g = M.item.o.filter(function (x) { return x.id === t.dataset.g; })[0];
    var i = +t.dataset.i;
    if (t.type === 'radio') M.sel[g.id] = i >= 0 ? (function () { var o = {}; o[i] = 1; return o; })() : {};
    else {
      var s = M.sel[g.id] = M.sel[g.id] || {};
      if (t.checked) { if (groupTotal(g) < g.n) s[i] = 1; } else delete s[i];
    }
    render(true); return;
  }
  if (M && M.mode === 'checkout') {
    if (t.name === 'tipo') cust.tipo = t.value;
    else if (t.name === 'pag') cust.pag = t.value;
    else if (t.id === 'f-cartao') cust.cartao = t.value;
    else if (t.id === 'f-semtroco') cust.semTroco = t.checked;
    else return;
    save('roma_cust_v1', cust); syncCheckout();
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.obs != null) { cart[+t.dataset.obs].o = t.value; saveCart(); return; }
  if (!M || M.mode !== 'checkout') return;
  var map = { 'f-nome': 'nome', 'f-tel': 'tel', 'f-rua': 'rua', 'f-bairro': 'bairro', 'f-compl': 'compl', 'f-troco': 'troco' };
  if (!map[t.id]) return;
  cust[map[t.id]] = t.value; t.removeAttribute('aria-invalid');
  save('roma_cust_v1', cust);
  $('#wa').href = waHref();
});

document.addEventListener('click', function (e) {
  var a = e.target.closest('#wa'); if (!a) return;
  var m = missing();
  if (m.length) {
    e.preventDefault();
    var box = $('#erro'); box.hidden = false;
    box.textContent = 'Falta preencher: ' + m.map(function (x) { return x.l; }).join(', ') + '.';
    m.forEach(function (x) { var el = document.getElementById(x.id); if (el) el.setAttribute('aria-invalid', 'true'); });
    var first = document.getElementById(m[0].id); if (first) first.focus();
    return;
  }
  $('#erro').hidden = true;
  var msg = mensagem();
  setTimeout(function () {
    if (!M) return;
    cart = []; saveCart();
    M.mode = 'sent'; M.msg = msg;
    render(false); updateBar();
    $('#panel').focus({ preventScroll: true });
  }, 500);
});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && M) closeModal(); });

function setNavH() { var n = $('.nav'); if (n) document.documentElement.style.setProperty('--navh', (n.offsetHeight + 8) + 'px'); }
renderMenu(); spy(); updateBar(); setNavH();
window.addEventListener('resize', setNavH);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(setNavH);
})();
</script>

</body>
</html>
